<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parkautomat P-1000</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Willkommen beim Parkautomat P-1000</h1>
    </header>
    <main>
        <section id="display">
            <h2>Anzeige</h2>
            <p id="display-message">Bitte folgen Sie den Anweisungen auf dem Display.</p>
            <table>
                <tr>
                    <th>Tarif</th>
                    <th class="rechts">Preis</th>
                </tr>
                <tr>
                    <td>Je angefangene Stunde</td>
                    <td class="rechts">2,50 €</td>
                </tr>
                <tr>
                    <td>Tagesticket (24 Stunden)</td>
                    <td class="rechts">15,00 €</td>
                </tr>
            </table>

            <h3>Geparkte Fahrzeuge:</h3>
            <ul id="parked-cars-list"></ul>
        </section>
        <section id="controls">
            <h2>Bedienfeld</h2>
            <form action="#" method="post">
                <label for="kennzeichen-input">Kennzeichen:</label>
                <input type="text" name="kennzeichen" id="kennzeichen-input" placeholder="M-U 123">
                <button type="submit" id="ticket-button">Parkticket ziehen</button>
            </form>
        </section>
    </main>
    <footer>
        &copy; 2025 Parkhaus-Betriebs GmbH
    </footer>
    <script src="parkautomat.js" defer></script>
</body>
</html>
